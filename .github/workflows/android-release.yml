name: Android Release

# 打标签即发版：push 一个 v* 标签 → 校验版本号 → 构建、跑测试、发布 Release、上传 APK。
#
# 版本号规则（源码是唯一来源，标签必须与源码完全对称）：
#   - 标签必须是 v<主>.<次>.<修订>，例如 v3.1.0
#   - 打标签前必须先在本地改好 app/build.gradle.kts：
#       versionName = "<主>.<次>.<修订>"
#       versionCode = 主*10000 + 次*100 + 修订
#   - 工作流只做校验：标签与源码不一致、或 versionCode 不符合换算规则，直接失败，
#     绝不静默改写文件，也绝不回写 main
#
# 也支持手动触发（workflow_dispatch）：用当前 build.gradle.kts 里的版本号直接发版。
on:
  push:
    tags:
      # ⚠️ GitHub Actions 的 tag 过滤用的是 glob（minimatch），不是正则！
      # 写成 'v[0-9]+.[0-9]+.[0-9]+' 里的 `+` 会被当成普通字符，永远匹配不上 v2.23.0。
      # 这里只做粗过滤（v 开头），具体的「三段数字」格式由下面的校验步骤用 grep -qE 严格把关，
      # 所以 v2.23.0-beta 这类标签会进入工作流但被校验步骤拒绝，不会误发版。
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 同一版本不并发跑两份，避免重复创建 Release 或重复递增版本号
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # 生成 changelog 需要上一个 tag 到本次的完整历史与全部标签
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验标签与源码版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"

          # 只接受纯 主.次.修订 三段数字：v3.1.0 可以，v3.1.0-beta / v3.1 不行。
          # 通配符 v[0-9]+.[0-9]+.[0-9]+ 会把 v3.1.0-beta 也带进来，所以这里再卡一次。
          if ! echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::标签格式不对：$GITHUB_REF_NAME"
            echo "::error::只接受 v<主>.<次>.<修订> 三段数字，例如 v3.1.0"
            exit 1
          fi

          # 版本号的唯一来源是源码。工作流不再改写文件、不再回写 main，
          # 标签与 app/build.gradle.kts 必须完全对称，否则直接失败。
          GRADLE_VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          GRADLE_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          EXPECT_CODE=$(echo "$TAG" | awk -F. '{print $1 * 10000 + $2 * 100 + $3}')

          echo "标签版本：$TAG（换算 versionCode = $EXPECT_CODE）"
          echo "源码版本：$GRADLE_VERSION（versionCode = $GRADLE_CODE）"

          if [ "$TAG" != "$GRADLE_VERSION" ]; then
            echo "::error::标签与源码版本不一致：标签是 v$TAG，但 app/build.gradle.kts 里写的是 $GRADLE_VERSION"
            echo "::error::请先在本地把 versionName 改成 \"$TAG\" 并提交，再打标签"
            exit 1
          fi

          if [ "$GRADLE_CODE" != "$EXPECT_CODE" ]; then
            echo "::error::versionCode 不符合换算规则：应为 $EXPECT_CODE（主*10000 + 次*100 + 修订），实际是 $GRADLE_CODE"
            exit 1
          fi

          echo "校验通过：v$TAG / versionCode $GRADLE_CODE"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: 还原 release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: 生成 keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 单元测试
        run: gradle :core:test --console=plain

      - name: 打包 release
        run: gradle :app:assembleRelease --console=plain

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION (versionCode $CODE)"

      - name: 生成更新日志（仅应用相关变化）
        id: changelog
        run: |
          # 只汇总影响应用的改动（app/ 与 core/），CI、脚本、文档等非应用变化不进日志。
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v${{ steps.version.outputs.version }}$" | head -n1)
          RANGE="HEAD"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD"
          LOG=$(git log $RANGE --no-merges --pretty='- %s' -- app core)
          [ -n "$LOG" ] || LOG="- 无应用相关变化"
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容（${PREV_TAG:-首次发布} → v${{ steps.version.outputs.version }}）"
            echo ""
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 重命名产物
        run: cp app/build/outputs/apk/release/app-release.apk "synapse-${{ steps.version.outputs.version }}-release.apk"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # 不指定时 GitHub 会把 tag 建在默认分支顶端，导致从分支发版时 tag 指向的代码与产物不符。
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: synapse-${{ steps.version.outputs.version }}-release.apk

